openapi: 3.0.3
info:
  title: Leaderboard API
  description: |
    API REST du projet Leaderboard — gestion de projets, challenges, tâches, contributions, évaluations et sync meetings.

    ## Authentification
    L'API utilise des cookies HTTP-only (`access_token` / `refresh_token`) via OAuth2 Google.
    Certaines routes nécessitent le rôle **admin**.
  version: 1.0.0

servers:
  - url: /api
    description: Next.js API routes

tags:
  - name: Auth
    description: Authentification (logout, refresh tokens)
  - name: Google Auth
    description: OAuth2 Google (authorize + callback)
  - name: Users
    description: Gestion des utilisateurs
  - name: Contributors
    description: Profil et tâches du contributeur connecté
  - name: Projects
    description: CRUD Projets
  - name: Challenges
    description: CRUD Challenges et actions associées
  - name: Challenge Team
    description: Gestion de l'équipe d'un challenge
  - name: Tasks
    description: CRUD Tâches et actions associées
  - name: Contributions
    description: Contributions des utilisateurs
  - name: Repos
    description: Gestion des dépôts et liens challenge-repo
  - name: Evaluation Grids
    description: Grilles d'évaluation, catégories et sous-critères (admin)
  - name: Sync Meetings
    description: Réunions de synchronisation
  - name: Leaderboard
    description: Classement des contributeurs
  - name: Onboarding
    description: Progression d'onboarding utilisateur
  - name: Cron
    description: Tâches planifiées internes

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
    cronBearer:
      type: http
      scheme: bearer

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: Validation error
        details:
          type: array
          items:
            type: object
      required: [error, details]

    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true

    # ── Users ──
    User:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        github_username:
          type: string
        full_name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [contributor, admin]

    CreateUser:
      type: object
      required: [full_name, role]
      properties:
        github_username:
          type: string
        full_name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        role:
          type: string

    # ── Projects ──
    Project:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true

    CreateProject:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string

    UpdateProject:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string

    # ── Challenges ──
    Challenge:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
        roadmap:
          type: string
          nullable: true
        completion:
          type: number
        contribution_points_reward:
          type: integer
        project_id:
          type: string
          format: uuid

    CreateChallenge:
      type: object
      required: [title, status, start_date, end_date, contribution_points_reward, project_id]
      properties:
        title:
          type: string
          minLength: 1
        status:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        description:
          type: string
        roadmap:
          type: string
        contribution_points_reward:
          type: integer
          minimum: 0
        project_id:
          type: string
          format: uuid

    UpdateChallenge:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        status:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        description:
          type: string
        roadmap:
          type: string
        contribution_points_reward:
          type: integer
          minimum: 0
        project_id:
          type: string
          format: uuid

    # ── Tasks ──
    Task:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        challenge_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
          description: Owner of this task's personal board. Null means this is a template task (edited by the challenge admin/manager and copied onto each contributor's board on join).
        parent_task_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [todo, in_progress, done]
        created_at:
          type: string
          format: date-time

    CreateTask:
      type: object
      required: [challenge_id, title]
      properties:
        challenge_id:
          type: string
          format: uuid
        parent_task_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        description:
          type: string
        template:
          type: boolean
          description: true creates a template task (challenge admin/manager only) instead of a task on the caller's own personal board.

    UpdateTask:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, done]
        parent_task_id:
          type: string
          format: uuid
          nullable: true

    TaskDetails:
      type: object
      properties:
        task:
          $ref: '#/components/schemas/Task'
        subTasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'

    # ── Contributions ──
    Contribution:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        score:
          type: number

    # ── Repos ──
    Repo:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        title:
          type: string
        type:
          type: string
        external_repo_id:
          type: string
          nullable: true
        project_id:
          type: string
          format: uuid

    CreateRepo:
      type: object
      required: [title, type, project_id]
      properties:
        title:
          type: string
          minLength: 1
        type:
          type: string
        external_repo_id:
          type: string
        project_id:
          type: string
          format: uuid

    LinkChallengeRepo:
      type: object
      required: [challenge_id, repo_id]
      properties:
        challenge_id:
          type: string
          format: uuid
        repo_id:
          type: string
          format: uuid

    # ── Evaluation Grids ──
    EvaluationGrid:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        version:
          type: integer
        status:
          type: string
          enum: [draft, published, archived]
        instructions:
          type: string
          nullable: true

    CreateEvaluationGrid:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
        version:
          type: integer
          minimum: 1
          default: 1
        status:
          type: string
          enum: [draft, published, archived]
          default: draft
        instructions:
          type: string

    UpdateEvaluationGrid:
      type: object
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [draft, published, archived]
        instructions:
          type: string

    GridCategory:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        grid_id:
          type: string
          format: uuid
        name:
          type: string
        weight:
          type: number
          minimum: 0
          maximum: 1
        type:
          type: string
          enum: [objective, mixed, subjective, contextual]
        position:
          type: integer

    CreateGridCategory:
      type: object
      required: [name, weight, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        weight:
          type: number
          minimum: 0
          maximum: 1
        type:
          type: string
          enum: [objective, mixed, subjective, contextual]
        position:
          type: integer
          minimum: 0
          default: 0

    UpdateGridCategory:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        weight:
          type: number
          minimum: 0
          maximum: 1
        type:
          type: string
          enum: [objective, mixed, subjective, contextual]
        position:
          type: integer
          minimum: 0

    Subcriterion:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        criterion:
          type: string
        description:
          type: string
          nullable: true
        weight:
          type: number
        metrics:
          type: array
          items:
            type: string
        indicators:
          type: array
          items:
            type: string
        scoring_excellent:
          type: string
          nullable: true
        scoring_good:
          type: string
          nullable: true
        scoring_average:
          type: string
          nullable: true
        scoring_poor:
          type: string
          nullable: true
        position:
          type: integer

    CreateSubcriterion:
      type: object
      required: [criterion]
      properties:
        criterion:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
        weight:
          type: number
          minimum: 0
          maximum: 1
        metrics:
          type: array
          items:
            type: string
        indicators:
          type: array
          items:
            type: string
        scoring_excellent:
          type: string
        scoring_good:
          type: string
        scoring_average:
          type: string
        scoring_poor:
          type: string
        position:
          type: integer
          minimum: 0
          default: 0

    UpdateSubcriterion:
      type: object
      properties:
        criterion:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
        weight:
          type: number
          minimum: 0
          maximum: 1
        metrics:
          type: array
          items:
            type: string
        indicators:
          type: array
          items:
            type: string
        scoring_excellent:
          type: string
        scoring_good:
          type: string
        scoring_average:
          type: string
        scoring_poor:
          type: string
        position:
          type: integer
          minimum: 0

    # ── Sync Meetings ──
    SyncMeeting:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        challenge_id:
          type: string
          format: uuid
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid

    CreateSyncMeeting:
      type: object
      required: [title, challenge_id, start_time, end_time]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        challenge_id:
          type: string
          format: uuid
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time

    # ── Leaderboard ──
    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        githubUsername:
          type: string
        bio:
          type: string
          nullable: true
        totalCP:
          type: number

    LeaderboardResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
        filters:
          type: object
          properties:
            projects:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    nullable: true
                  name:
                    type: string

    # ── Onboarding ──
    OnboardingProgress:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        clicked_challenge:
          type: boolean
        assigned_task:
          type: boolean
        evaluated_contribution:
          type: boolean
        validated_task:
          type: boolean
        joined_meeting:
          type: boolean

    # ── Session ──
    SessionUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        githubUsername:
          type: string
        email:
          type: string
          format: email
        role:
          type: string

# ═══════════════════════════════════════════════════════════════
#  PATHS
# ═══════════════════════════════════════════════════════════════
paths:

  # ── Auth ──────────────────────────────────────────────────
  /auth/logout:
    post:
      tags: [Auth]
      summary: Déconnexion
      description: Invalide les refresh tokens et supprime les cookies d'authentification.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Déconnexion réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rafraîchir les tokens
      description: Utilise le refresh_token cookie pour générer de nouveaux access_token et refresh_token (rotation).
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Tokens renouvelés (nouveaux cookies définis)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          description: Refresh token manquant ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Google Auth ───────────────────────────────────────────
  /google-auth/authorize:
    get:
      tags: [Google Auth]
      summary: Initier le flux OAuth2 Google
      description: Redirige vers la page de consentement Google.
      parameters:
        - name: from
          in: query
          description: URL de redirection après authentification
          schema:
            type: string
            default: /
      responses:
        '307':
          description: Redirection vers Google OAuth

  /google-auth/callback:
    get:
      tags: [Google Auth]
      summary: Callback OAuth2 Google
      description: Reçoit le code d'autorisation Google, crée ou lie le compte utilisateur, et redirige avec les cookies JWT.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        '307':
          description: Redirection vers l'application avec cookies JWT

  # ── Users ─────────────────────────────────────────────────
  /users:
    get:
      tags: [Users]
      summary: Lister tous les utilisateurs
      responses:
        '200':
          description: Liste des utilisateurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags: [Users]
      summary: Créer un utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  # ── Contributors ──────────────────────────────────────────
  /contributors/me:
    get:
      tags: [Contributors]
      summary: Profil du contributeur connecté
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Données de session
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/SessionUser'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contributors/me/tasks:
    get:
      tags: [Contributors]
      summary: Tâches assignées au contributeur connecté
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Liste des tâches avec le titre du challenge
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Task'
                    - type: object
                      properties:
                        challenge_title:
                          type: string
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Projects ──────────────────────────────────────────────
  /projects:
    get:
      tags: [Projects]
      summary: Lister tous les projets
      responses:
        '200':
          description: Liste des projets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      tags: [Projects]
      summary: Créer un projet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      responses:
        '201':
          description: Projet créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Projects]
      summary: Récupérer un projet
      responses:
        '200':
          description: Projet trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Projet non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Projects]
      summary: Mettre à jour un projet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProject'
      responses:
        '200':
          description: Projet mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    delete:
      tags: [Projects]
      summary: Supprimer un projet
      responses:
        '200':
          description: Projet supprimé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  # ── Challenges ────────────────────────────────────────────
  /challenges:
    get:
      tags: [Challenges]
      summary: Lister tous les challenges
      responses:
        '200':
          description: Liste des challenges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Challenge'
    post:
      tags: [Challenges]
      summary: Créer un challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChallenge'
      responses:
        '201':
          description: Challenge créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '400':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /challenges/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Challenges]
      summary: Récupérer un challenge
      responses:
        '200':
          description: Challenge trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '404':
          description: Challenge non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Challenges]
      summary: Mettre à jour un challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChallenge'
      responses:
        '200':
          description: Challenge mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '400':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    delete:
      tags: [Challenges]
      summary: Supprimer un challenge
      responses:
        '200':
          description: Challenge supprimé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /challenges/{id}/context:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Challenges]
      summary: Contexte complet d'un challenge
      description: Récupère le challenge avec toutes ses données associées (tâches, équipe, repos, etc.).
      responses:
        '200':
          description: Contexte du challenge
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /challenges/{id}/close:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Challenges]
      summary: Clôturer un challenge
      description: >-
        Passe le challenge au statut 'completed'. Ne calcule plus aucun
        reward : code, ML et validation versent déjà en live via le ledger
        reward_entries.
      responses:
        '200':
          description: Challenge clôturé
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  challenge:
                    type: object
        '404':
          description: Challenge introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /challenges/{id}/join:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Challenges]
      summary: Rejoindre un challenge
      description: L'utilisateur connecté rejoint l'équipe du challenge.
      security:
        - cookieAuth: []
      responses:
        '201':
          description: Rejoint avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Déjà membre du challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /challenges/{id}/project-evaluation:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Challenges]
      summary: Lancer l'évaluation du board personnel (challenge code)
      description: |
        Fire-and-forget : planifie l'évaluation IA du board personnel de l'utilisateur connecté
        et répond immédiatement. Le statut vit sur la contribution `project`, pollée par l'UI.
      security:
        - cookieAuth: []
      responses:
        '202':
          description: Évaluation planifiée
          content:
            application/json:
              schema:
                type: object
                properties:
                  scheduled:
                    type: boolean
        '400':
          description: Préconditions non remplies (board incomplet, workspace non prêt, challenge fermé, etc.)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  reason:
                    type: string
                    enum: [not_code_challenge, no_rules, not_participant, workspace_not_ready, no_tasks, tasks_not_done, challenge_closed]
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Une évaluation est déjà en cours
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  reason:
                    type: string
                    enum: [already_running]

  /challenges/{id}/workspace:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Challenges]
      summary: Déclarer son repo GitHub personnel (mode own_repo)
      description: Réservé aux challenges code en mode `own_repo` — le contributeur déclare (ou change) l'URL publique du repo qui porte son livrable.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo_url]
              properties:
                repo_url:
                  type: string
                  description: URL publique d'un repo GitHub (https://github.com/owner/repo[/tree/branch])
      responses:
        '200':
          description: Workspace mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  participation:
                    type: object
        '400':
          description: Challenge non éligible (pas code / pas own_repo) ou repo_url invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: L'utilisateur n'a pas rejoint ce challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

