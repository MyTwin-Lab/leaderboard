  /sync-meetings/{id}/analysis:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Sync Meetings]
      summary: Récupérer l'analyse d'une réunion
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Analyse trouvée
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysis:
                    type: object
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Analyse non trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sync-meetings/{id}/participants:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Sync Meetings]
      summary: Récupérer les participants d'une réunion
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Liste des participants
          content:
            application/json:
              schema:
                type: object
                properties:
                  participants:
                    type: array
                    items:
                      type: object
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Leaderboard ───────────────────────────────────────────
  /leaderboard:
    get:
      tags: [Leaderboard]
      summary: Classement des contributeurs
      parameters:
        - name: projectId
          in: query
          description: "Filtrer par projet (UUID ou `all`)"
          schema:
            type: string
            default: all
        - name: timePeriod
          in: query
          description: Période de temps
          schema:
            type: string
            enum: [all, month, week]
            default: all
      responses:
        '200':
          description: Classement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
        '400':
          description: projectId invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Onboarding ────────────────────────────────────────────
  /onboarding:
    get:
      tags: [Onboarding]
      summary: Progression d'onboarding de l'utilisateur connecté
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Progression (auto-initialisée si absente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingProgress'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Onboarding]
      summary: Marquer une étape comme complétée
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step]
              properties:
                step:
                  type: string
                  description: Nom de l'étape d'onboarding
                  enum: [clicked_challenge, assigned_task, evaluated_contribution, validated_task, joined_meeting]
      responses:
        '200':
          description: Progression mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingProgress'
        '400':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Progression non trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Cron ──────────────────────────────────────────────────
  /cron/check-meetings:
    get:
      tags: [Cron]
      summary: Vérifier les réunions terminées
      description: Tâche planifiée interne. Requiert un Bearer token (CRON_SECRET).
      security:
        - cronBearer: []
      responses:
        '200':
          description: Vérification effectuée
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  timestamp:
                    type: string
                    format: date-time
        '401':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
